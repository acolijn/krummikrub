services:
  krummikrub:
    build:
      context: .
      args:
        # Public URL prefix the app is served at. Trailing slash REQUIRED.
        # Use "/" for root-domain deploys, "/krummikrub/" when behind a
        # subpath reverse-proxy.
        BASE_PATH: ${BASE_PATH:-/krummikrub/}
    image: krummikrub:latest
    container_name: krummikrub
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"

  krummikrub-api:
    build: ./api
    image: krummikrub-api:latest
    container_name: krummikrub-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5174:80"
    volumes:
      - counter-data:/data

volumes:
  counter-data:
